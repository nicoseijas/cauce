name: Actualizar estado hídrico

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: estado
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python pipeline/build_estado.py
      - name: Commitear estado si cambió
        run: |
          git config user.name "estado-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/public/data/estado_actual.json data/historico
          git diff --cached --quiet || git commit -m "chore: estado hídrico $(date -u +%Y-%m-%dT%H:%M)"
          git push
      # Un push hecho con GITHUB_TOKEN no dispara otros workflows,
      # así que el deploy de Pages se hace acá mismo.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
